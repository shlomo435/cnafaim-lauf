<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <title>Netlify form definitions</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Static form definition for Netlify Forms.

      Netlify detects forms by parsing HTML in the publish directory at deploy
      time. This site is a Next.js static export, so the React forms are not
      reliably detected on their own - this file is the canonical definition.
      The React forms (ContactFormClient, SideDrawerClient) submit here via
      fetch with a url-encoded body; see src/lib/contact.ts.

      Every field the app submits must exist here, or Netlify drops it.
    -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>הנושא הזה אוחד | כנפיים לעוף</title>
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="דף הנושא הזה אוחד לתוך נושא רחב יותר. אפשר למצוא את כל המדריכים והכתבות בעמוד הבלוג."
    />
    <style>
      :root {
        --cream: #fff0f5;
        --cream-alt: #fce4ef;
        --border: #f8bbd9;
        --text-dark: #3949ab;
        --text-mid: #5c4a6e;
        --rose: #c01880;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: var(--cream);
        color: var(--text-dark);
        font-family: Rubik, Heebo, "Segoe UI", system-ui, -apple-system, sans-serif;
        font-weight: 300;
        text-align: center;
      }
      main { max-width: 34rem; }
      h1 {
        font-size: clamp(1.6rem, 5vw, 2.2rem);
        font-weight: 500;
        letter-spacing: -0.02em;
        margin: 0 0 1rem;
      }
      p {
        color: var(--text-mid);
        font-size: 1.05rem;
        line-height: 1.9;
        margin: 0 0 1.5rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a.primary,
      a.secondary {
        display: inline-block;
        padding: 0.85rem 1.75rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        font-weight: 500;
        text-decoration: none;
        transition: transform 0.2s ease;
      }
      a.primary {
        background-color: var(--rose);
        color: #fff;
        box-shadow: 0 6px 20px rgba(192, 24, 128, 0.22);
      }
      a.secondary {
        background-color: var(--cream-alt);
        color: var(--text-mid);
        border: 1px solid var(--border);
      }
      a.primary:hover,
      a.secondary:hover { transform: translateY(-2px); }
      .rule {
        width: 4rem;
        height: 1px;
        background-color: var(--border);
        margin: 0 auto 1.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="rule"></div>
      <h1>הנושא הזה אוחד</h1>
      <p>
        ריכזנו את הנושאים בבלוג לקבוצות רחבות יותר, כדי שיהיה קל יותר למצוא את מה שמחפשים.
        הדף הישן כבר לא קיים, אבל התוכן עצמו נמצא במקום אחר.
      </p>
      <div class="links">
        <a class="primary" href="/blog">לכל המדריכים והכתבות</a>
        <a class="secondary" href="/">לעמוד הבית</a>
      </div>
    </main>
  </body>
</html>

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_SKIP_MIDDLEWARE_COMPILATION = "1"

# ── Domain canonicalisation ────────────────────────────────────────────────────
# One canonical origin: https://cnafim-lauf.co.il (apex, https). These make the
# platform defaults explicit and repo-tracked. force = true so they fire even
# though the requested file exists.
#
# Trailing-slash note: /blog/ -> /blog is deliberately NOT expressed here.
# Netlify normalises paths BEFORE matching redirect rules, so a from = "/*/"
# rule degrades to "/*" and would redirect the whole site into a loop. That
# normalisation is done safely by Netlify's router itself, driven by the site
# emitting flat files (trailingSlash: false in next.config.ts).

[[redirects]]
  from = "http://cnafim-lauf.co.il/*"
  to = "https://cnafim-lauf.co.il/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.cnafim-lauf.co.il/*"
  to = "https://cnafim-lauf.co.il/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cnafim-lauf.co.il/*"
  to = "https://cnafim-lauf.co.il/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking: this site is never meant to be framed.
    X-Frame-Options = "DENY"

    # Stop the browser guessing a response's type (MIME confusion attacks).
    X-Content-Type-Options = "nosniff"

    # Don't leak full URLs to third parties.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # No page here needs these device APIs - deny them outright.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    # The legacy XSS auditor is deprecated and can itself introduce bugs;
    # 0 disables it and we rely on the CSP below instead.
    X-XSS-Protection = "0"

    # Static export, so scripts cannot carry a per-request nonce: 'unsafe-inline'
    # is required for the inline JSON-LD blocks, the pre-paint js-class script,
    # and inline style attributes. Everything else is locked to this origin, so
    # injected third-party scripts/frames are still blocked.
    # NOTE: adding analytics (GA4, Clarity) later means allowing its domain in
    # script-src and connect-src, or it will be blocked here.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
